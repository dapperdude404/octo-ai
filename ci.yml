name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check index.html exists
        run: test -f index.html
      - name: Check the JavaScript for syntax errors
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert blocks, 'No inline script found'
          open('app-check.js', 'w', encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check app-check.js
      - name: Check the developer credit is still there
        run: grep -q "isdapperdude404" index.html
